<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Treino</title>
<meta name="theme-color" content="#15171A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<style>
  :root{
    --bg:#15171A;
    --surface:#1F2226;
    --surface-2:#282C31;
    --line:#33383E;
    --text:#EDEDED;
    --text-dim:#8A8F98;
    --accent:#FF4B2B;
    --accent-dim:#5c2013;
    --good:#00D9A3;
    --good-dim:#0c3d31;
    --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    overscroll-behavior:none;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .num{font-family:"SF Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums;}
  h1,h2,h3{margin:0;}
  .eyebrow{
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--accent); font-weight:700; margin-bottom:4px;
  }
  header.top{
    padding:22px 20px 14px;
    display:flex; align-items:baseline; justify-content:space-between;
  }
  header.top h1{
    font-size:26px; font-weight:800; letter-spacing:-0.02em;
  }
  header.top .date{color:var(--text-dim); font-size:13px;}

  main{padding:0 16px 100px; max-width:520px; margin:0 auto;}
  .view{display:none;}
  .view.active{display:block;}

  .daytabs{display:flex; gap:8px; margin-bottom:18px;}
  .daytab{
    flex:1; padding:10px 0; text-align:center; border-radius:10px;
    background:var(--surface); color:var(--text-dim);
    font-weight:700; font-size:13px; letter-spacing:.03em;
    border:1px solid var(--line);
  }
  .daytab.active{background:var(--accent); color:#fff; border-color:var(--accent);}

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:12px;
  }
  .ex-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .ex-name{font-size:16px; font-weight:700;}
  .ex-tag{font-size:10px; color:var(--good); letter-spacing:.08em; text-transform:uppercase; font-weight:700;}
  .ex-remove{color:var(--text-dim); font-size:18px; padding:4px 8px; border:none; background:none;}

  .set-row{
    display:grid; grid-template-columns:22px 1fr 1fr 32px 28px; gap:6px; align-items:center;
    margin-bottom:8px;
  }
  .set-idx{color:var(--text-dim); font-size:13px; font-weight:700;}
  .set-row input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--text);
    border-radius:8px; padding:9px 8px; font-size:15px; text-align:center;
  }
  .set-done{
    width:32px;height:32px;border-radius:8px;border:1px solid var(--line);
    background:var(--surface-2); color:var(--text-dim); font-size:16px;
  }
  .set-done.on{background:var(--good-dim); border-color:var(--good); color:var(--good);}
  .set-remove{
    width:28px;height:32px;border:none;background:none;color:var(--text-dim);
    font-size:15px; opacity:.7;
  }

  .status-active{
    display:flex; align-items:center; gap:8px;
    background:var(--good-dim); border:1px solid var(--good); color:var(--good);
    padding:11px 14px; border-radius:12px; font-size:13px; font-weight:700;
    margin-bottom:16px;
  }
  .status-dot{
    width:8px; height:8px; border-radius:50%; background:var(--good);
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  #workoutStatus .btn-primary{ margin:0 0 16px; }

  .btn-line{
    width:100%; padding:10px; border-radius:10px; border:1px dashed var(--line);
    background:none; color:var(--text-dim); font-size:13px; font-weight:600; margin-top:2px;
  }
  .btn-primary{
    width:100%; padding:14px; border-radius:12px; border:none;
    background:var(--accent); color:#fff; font-size:15px; font-weight:800;
    letter-spacing:.02em; margin:18px 0 8px;
  }
  .btn-ghost{
    width:100%; padding:12px; border-radius:12px; border:1px solid var(--line);
    background:var(--surface); color:var(--text); font-size:14px; font-weight:700;
  }

  .addex{display:flex; gap:8px; margin-bottom:16px;}
  .addex input{
    flex:1; background:var(--surface); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:11px 12px; font-size:14px;
  }
  .addex button{
    width:44px; border-radius:10px; border:1px solid var(--accent); background:var(--accent-dim);
    color:var(--accent); font-size:20px; font-weight:800;
  }

  nav.bottom{
    position:fixed; left:0; right:0; bottom:0;
    padding-bottom:env(safe-area-inset-bottom);
    background:rgba(21,23,26,.92); backdrop-filter:blur(14px);
    border-top:1px solid var(--line);
    display:flex;
  }
  nav.bottom button{
    flex:1; padding:12px 0 10px; background:none; border:none; color:var(--text-dim);
    font-size:10px; letter-spacing:.05em; text-transform:uppercase; font-weight:700;
    display:flex; flex-direction:column; align-items:center; gap:4px;
  }
  nav.bottom button.active{color:var(--accent);}
  nav.bottom svg{width:22px;height:22px;}

  /* Histórico */
  .sess{padding:14px 0; border-bottom:1px solid var(--line);}
  .sess:last-child{border-bottom:none;}
  .sess-top{display:flex; justify-content:space-between; margin-bottom:6px;}
  .sess-day{font-weight:800; font-size:14px;}
  .sess-date{color:var(--text-dim); font-size:12px;}
  .sess-line{color:var(--text-dim); font-size:13px; margin-top:2px;}
  .sess-meta{display:flex; gap:12px; margin:8px 0 8px; flex-wrap:wrap;}
  .sess-meta span{font-size:12px; color:var(--text-dim); font-weight:600;}
  .sess-meta b{color:var(--text); font-weight:800;}
  .empty{color:var(--text-dim); font-size:14px; text-align:center; padding:60px 20px; line-height:1.6;}

  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  .cal-title{font-weight:800; font-size:15px; text-transform:capitalize;}
  .cal-nav{background:var(--surface-2); border:1px solid var(--line); color:var(--text); width:30px;height:30px;border-radius:8px; font-size:16px;}
  .cal-week{display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:4px;}
  .cal-week span{text-align:center; font-size:11px; color:var(--text-dim); font-weight:700;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px;}
  .cal-cell{
    aspect-ratio:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:none; border:1px solid transparent; color:var(--text); font-size:13px; border-radius:8px;
    gap:3px;
  }
  .cal-cell.empty{visibility:hidden;}
  .cal-cell.today span{color:var(--accent); font-weight:800;}
  .cal-cell.selected{background:var(--surface-2); border-color:var(--accent);}
  .cal-dot{width:5px;height:5px;border-radius:50%; background:var(--good);}
  .cal-clear{font-size:12px; color:var(--accent); background:none; border:none; font-weight:700; padding:0 0 2px;}

  .stat-row{display:flex; gap:10px; margin-bottom:16px;}
  .stat{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 10px; text-align:center;}
  .stat .v{font-size:22px; font-weight:800;}
  .stat .l{font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}

  /* Timer */
  .timerwrap{display:flex; flex-direction:column; align-items:center; padding:20px 0 10px;}
  .timerdial{position:relative; width:240px; height:240px; margin:10px 0 20px;}
  .timerdial svg{transform:rotate(-90deg);}
  .timerdial .bg{stroke:var(--surface-2);}
  .timerdial .fg{stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .25s linear;}
  .timernum{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:46px; font-weight:800;
  }
  .presets{display:flex; gap:10px; margin-bottom:18px;}
  .preset{
    padding:10px 16px; border-radius:20px; border:1px solid var(--line); background:var(--surface);
    color:var(--text); font-size:14px; font-weight:700;
  }
  .preset.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .timerbtns{display:flex; gap:10px; width:100%; max-width:280px;}
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="eyebrow">Treino</div>
    <h1 id="headTitle">Hoje</h1>
  </div>
  <div class="date num" id="headDate"></div>
</header>

<main>

  <!-- VIEW: TREINO -->
  <section class="view active" id="view-treino">
    <div class="daytabs" id="dayTabs"></div>
    <div id="workoutStatus"></div>
    <div class="addex">
      <input type="text" id="newExName" placeholder="Adicionar exercício">
      <button id="addExBtn">+</button>
    </div>
    <div id="exList"></div>
    <button class="btn-primary" id="finishBtn">Finalizar treino</button>
  </section>

  <!-- VIEW: HISTORICO -->
  <section class="view" id="view-historico">
    <div class="daytabs" id="histFilter"></div>
    <div class="card" id="calWrap"></div>
    <div class="stat-row" id="statRow"></div>
    <div class="card" id="histCard">
      <div id="histList"></div>
    </div>
  </section>

  <!-- VIEW: TIMER -->
  <section class="view" id="view-timer">
    <div class="timerwrap">
      <div class="timerdial">
        <svg width="240" height="240" viewBox="0 0 240 240">
          <circle class="bg" cx="120" cy="120" r="106" fill="none" stroke-width="14"/>
          <circle class="fg" id="timerRing" cx="120" cy="120" r="106" fill="none" stroke-width="14"
            stroke-dasharray="666" stroke-dashoffset="0"/>
        </svg>
        <div class="timernum num" id="timerNum">60</div>
      </div>
      <div class="presets" id="presets"></div>
      <div class="timerbtns">
        <button class="btn-ghost" id="timerReset">Reiniciar</button>
        <button class="btn-primary" id="timerToggle" style="margin:0;">Iniciar</button>
      </div>
    </div>
  </section>

</main>

<nav class="bottom">
  <button data-view="treino" class="active">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 6.5l11 11M4 9l3-3 2 2-3 3-2-2zm9 9l3-3 2 2-3 3-2-2zM15 4l1.5-1.5 5 5L20 9l-5-5zM4 20l1.5-1.5 5 5L9 25l-5-5z" transform="translate(0,0)"/></svg>
    Treino
  </button>
  <button data-view="historico">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18M7 15l4-5 3 3 5-7"/></svg>
    Histórico
  </button>
  <button data-view="timer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/></svg>
    Timer
  </button>
</nav>

<script>
/* ---------- estado / storage ---------- */
const DAYS = ["Push","Pull","Legs"];
const DEFAULT_PLAN = {
  Push: ["Supino reto","Supino inclinado halter","Desenvolvimento ombro","Crucifixo","Tríceps corda","Abdômen — prancha"],
  Pull: ["Puxada frente","Remada curvada","Remada unilateral","Rosca direta","Rosca martelo","Abdômen — elevação de pernas"],
  Legs: ["Agachamento","Leg press","Cadeira extensora","Mesa flexora","Panturrilha","Abdômen — abdominal infra"]
};

function loadPlan(){
  const raw = localStorage.getItem('treino_plano');
  if(raw) return JSON.parse(raw);
  localStorage.setItem('treino_plano', JSON.stringify(DEFAULT_PLAN));
  return JSON.parse(JSON.stringify(DEFAULT_PLAN));
}
function savePlan(p){ localStorage.setItem('treino_plano', JSON.stringify(p)); }

function loadHist(){
  return JSON.parse(localStorage.getItem('treino_historico') || '[]');
}
function saveHist(h){ localStorage.setItem('treino_historico', JSON.stringify(h)); }

let plan = loadPlan();
let currentDay = localStorage.getItem('treino_dia_atual') || DAYS[0];
let session = {}; // { exName: [{peso,reps,done}] }
let workoutStart = null; // ISO string ou null

function sessionKey(){ return 'treino_sessao_'+currentDay; }
function loadSession(){
  const raw = localStorage.getItem(sessionKey());
  session = raw ? JSON.parse(raw) : {};
}
function saveSession(){ localStorage.setItem(sessionKey(), JSON.stringify(session)); }

function startKey(){ return 'treino_start_'+currentDay; }
function loadWorkoutStart(){ workoutStart = localStorage.getItem(startKey()); }

function formatMMSS(totalSec){
  const m = Math.floor(totalSec/60), s = totalSec%60;
  return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function formatDuration(sec){
  if(sec==null) return null;
  const min = Math.round(sec/60);
  if(min < 1) return '<1min';
  if(min < 60) return min+'min';
  const h = Math.floor(min/60), remMin = min%60;
  return h+'h'+(remMin?' '+remMin+'min':'');
}

/* ---------- data ---------- */
const dateEl = document.getElementById('headDate');
const now = new Date();
dateEl.textContent = now.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});

/* ---------- navegação ---------- */
document.querySelectorAll('nav.bottom button').forEach(btn=>{
  btn.addEventListener('click', ()=> switchView(btn.dataset.view));
});
function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active', b.dataset.view===name));
  const titles = {historico:'Histórico', timer:'Descanso'};
  if(name!=='treino') document.getElementById('headTitle').textContent = titles[name];
  else tickHeader();
  if(name==='historico') renderHistorico();
}

function tickHeader(){
  if(!document.getElementById('view-treino').classList.contains('active')) return;
  if(workoutStart){
    const secs = Math.floor((Date.now()-new Date(workoutStart).getTime())/1000);
    document.getElementById('headTitle').textContent = formatMMSS(secs);
  } else {
    document.getElementById('headTitle').textContent = currentDay;
  }
}
setInterval(tickHeader, 1000);

/* ---------- tabs de dia ---------- */
function renderDayTabs(){
  const wrap = document.getElementById('dayTabs');
  wrap.innerHTML = '';
  DAYS.forEach(d=>{
    const b = document.createElement('button');
    b.className = 'daytab'+(d===currentDay?' active':'');
    b.textContent = d;
    b.onclick = ()=>{
      currentDay = d;
      localStorage.setItem('treino_dia_atual', d);
      loadSession();
      loadWorkoutStart();
      renderDayTabs();
      renderExList();
      renderWorkoutStatus();
      tickHeader();
    };
    wrap.appendChild(b);
  });
}

/* ---------- status / cronômetro do treino ---------- */
function renderWorkoutStatus(){
  const wrap = document.getElementById('workoutStatus');
  if(workoutStart){
    const t = new Date(workoutStart).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    wrap.innerHTML = `<div class="status-active"><span class="status-dot"></span>Treino em andamento — iniciado às ${t}</div>`;
  } else {
    wrap.innerHTML = `<button class="btn-primary">Iniciar treino</button>`;
    wrap.querySelector('button').onclick = startWorkout;
  }
}
function startWorkout(){
  workoutStart = new Date().toISOString();
  localStorage.setItem(startKey(), workoutStart);
  renderWorkoutStatus();
  tickHeader();
}

/* ---------- lista de exercícios ---------- */
function renderExList(){
  const wrap = document.getElementById('exList');
  wrap.innerHTML = '';
  const exs = plan[currentDay] || [];
  exs.forEach((exName, exIdx)=>{
    if(!session[exName]) session[exName] = [{peso:'',reps:'',done:false}];
    const card = document.createElement('div');
    card.className = 'card';

    const head = document.createElement('div');
    head.className = 'ex-head';
    head.innerHTML = `<div>
        <div class="ex-name">${exName}</div>
      </div>`;
    const rm = document.createElement('button');
    rm.className = 'ex-remove';
    rm.textContent = '✕';
    rm.onclick = ()=>{
      plan[currentDay] = plan[currentDay].filter(e=>e!==exName);
      delete session[exName];
      savePlan(plan); saveSession();
      renderExList();
    };
    head.appendChild(rm);
    card.appendChild(head);

    session[exName].forEach((set, setIdx)=>{
      const row = document.createElement('div');
      row.className = 'set-row';
      row.innerHTML = `
        <div class="set-idx">${setIdx+1}</div>
        <input type="number" inputmode="decimal" placeholder="kg" value="${set.peso}">
        <input type="number" inputmode="numeric" placeholder="reps" value="${set.reps}">
      `;
      const doneBtn = document.createElement('button');
      doneBtn.className = 'set-done'+(set.done?' on':'');
      doneBtn.textContent = '✓';
      doneBtn.onclick = ()=>{
        const wasOff = !set.done;
        set.done = !set.done;
        saveSession();
        renderExList();
        if(wasOff && set.done) startAutoRest();
      };
      const [pesoInput, repsInput] = row.querySelectorAll('input');
      pesoInput.oninput = ()=>{ set.peso = pesoInput.value; saveSession(); };
      repsInput.oninput = ()=>{ set.reps = repsInput.value; saveSession(); };
      row.appendChild(doneBtn);

      const rmSetBtn = document.createElement('button');
      rmSetBtn.className = 'set-remove';
      rmSetBtn.textContent = '✕';
      rmSetBtn.onclick = ()=>{
        session[exName].splice(setIdx,1);
        saveSession();
        renderExList();
      };
      row.appendChild(rmSetBtn);

      card.appendChild(row);
    });

    const addSetBtn = document.createElement('button');
    addSetBtn.className = 'btn-line';
    addSetBtn.textContent = '+ série';
    addSetBtn.onclick = ()=>{
      session[exName].push({peso:'',reps:'',done:false});
      saveSession();
      renderExList();
    };
    card.appendChild(addSetBtn);
    wrap.appendChild(card);
  });
}

document.getElementById('addExBtn').onclick = ()=>{
  const input = document.getElementById('newExName');
  const name = input.value.trim();
  if(!name) return;
  if(!plan[currentDay]) plan[currentDay] = [];
  plan[currentDay].push(name);
  savePlan(plan);
  input.value = '';
  renderExList();
};

document.getElementById('finishBtn').onclick = ()=>{
  const exercicios = Object.entries(session)
    .filter(([name])=> (plan[currentDay]||[]).includes(name))
    .map(([nome, sets])=>({
      nome,
      series: sets.filter(s=> s.peso!=='' || s.reps!=='')
    }))
    .filter(e=> e.series.length>0);
  if(exercicios.length===0){ alert('Registre pelo menos uma série antes de finalizar.'); return; }
  let duracaoSeg = null;
  if(workoutStart){
    duracaoSeg = Math.floor((Date.now()-new Date(workoutStart).getTime())/1000);
  }
  const hist = loadHist();
  hist.unshift({
    data: new Date().toISOString(),
    dia: currentDay,
    exercicios,
    duracaoSeg
  });
  saveHist(hist);
  localStorage.removeItem(sessionKey());
  localStorage.removeItem(startKey());
  workoutStart = null;
  loadSession();
  renderExList();
  renderWorkoutStatus();
  tickHeader();
  switchView('historico');
};

/* ---------- histórico ---------- */
let histFilter = 'Todos';
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();
let selectedDate = null; // 'YYYY-MM-DD'

function dateKey(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function renderCalendar(hist){
  const wrap = document.getElementById('calWrap');
  const trained = new Set(hist.map(s=> dateKey(new Date(s.data))));
  const monthNames = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
  const firstDay = new Date(calYear, calMonth, 1);
  const startWeekday = firstDay.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const todayStr = dateKey(new Date());

  let cells = '';
  for(let i=0;i<startWeekday;i++) cells += `<div class="cal-cell empty"></div>`;
  for(let day=1; day<=daysInMonth; day++){
    const key = calYear+'-'+String(calMonth+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const hasTrain = trained.has(key);
    const cls = ['cal-cell'];
    if(key===todayStr) cls.push('today');
    if(key===selectedDate) cls.push('selected');
    cells += `<button class="${cls.join(' ')}" data-key="${key}"><span>${day}</span>${hasTrain?'<i class="cal-dot"></i>':''}</button>`;
  }

  wrap.innerHTML = `
    <div class="cal-head">
      <button class="cal-nav" id="calPrev">‹</button>
      <div class="cal-title">${monthNames[calMonth]} ${calYear}</div>
      <button class="cal-nav" id="calNext">›</button>
    </div>
    <div class="cal-week"><span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span></div>
    <div class="cal-grid">${cells}</div>
    ${selectedDate ? `<button class="cal-clear" id="calClear">Ver todos os dias ✕</button>` : ''}
  `;
  document.getElementById('calPrev').onclick = ()=>{ calMonth--; if(calMonth<0){calMonth=11; calYear--;} renderHistorico(); };
  document.getElementById('calNext').onclick = ()=>{ calMonth++; if(calMonth>11){calMonth=0; calYear++;} renderHistorico(); };
  wrap.querySelectorAll('.cal-cell[data-key]').forEach(btn=>{
    btn.onclick = ()=>{
      const key = btn.dataset.key;
      selectedDate = (selectedDate===key) ? null : key;
      renderHistorico();
    };
  });
  const clearBtn = document.getElementById('calClear');
  if(clearBtn) clearBtn.onclick = ()=>{ selectedDate = null; renderHistorico(); };
}

function renderHistFilter(){
  const wrap = document.getElementById('histFilter');
  const opts = ['Todos', ...DAYS];
  wrap.innerHTML = '';
  opts.forEach(o=>{
    const b = document.createElement('button');
    b.className = 'daytab'+(o===histFilter?' active':'');
    b.textContent = o;
    b.onclick = ()=>{ histFilter = o; renderHistorico(); };
    wrap.appendChild(b);
  });
}
function renderHistorico(){
  renderHistFilter();
  let hist = loadHist().filter(s=> histFilter==='Todos' || s.dia===histFilter);
  renderCalendar(hist);
  if(selectedDate){
    hist = hist.filter(s=> dateKey(new Date(s.data))===selectedDate);
  }
  const statRow = document.getElementById('statRow');
  const totalSessoes = hist.length;
  const ultimos30 = hist.filter(s=> (Date.now()-new Date(s.data).getTime()) < 30*86400000).length;
  let totalVolume = 0;
  hist.forEach(s=> s.exercicios.forEach(e=> e.series.forEach(st=>{
    const p = parseFloat(st.peso)||0, r = parseFloat(st.reps)||0;
    totalVolume += p*r;
  })));
  statRow.innerHTML = `
    <div class="stat"><div class="v num">${totalSessoes}</div><div class="l">Treinos</div></div>
    <div class="stat"><div class="v num">${ultimos30}</div><div class="l">Últimos 30d</div></div>
    <div class="stat"><div class="v num">${Math.round(totalVolume).toLocaleString('pt-BR')}</div><div class="l">Vol. total (kg)</div></div>
  `;

  const listEl = document.getElementById('histList');
  if(hist.length===0){
    listEl.innerHTML = '<div class="empty">Nenhum treino registrado ainda para esse filtro.<br>Finalize um treino na aba Treino para ver o histórico aqui.</div>';
    return;
  }
  listEl.innerHTML = '';
  hist.slice(0,60).forEach(s=>{
    const div = document.createElement('div');
    div.className = 'sess';
    const d = new Date(s.data);
    const dstr = d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'});
    let sessReps = 0, sessVol = 0;
    const linhas = s.exercicios.map(e=>{
      const resumo = e.series.map(st=>{
        const p = parseFloat(st.peso)||0, r = parseFloat(st.reps)||0;
        sessReps += r; sessVol += p*r;
        return `${st.peso||'-'}kg×${st.reps||'-'}`;
      }).join(', ');
      return `<div class="sess-line"><b style="color:var(--text)">${e.nome}:</b> ${resumo}</div>`;
    }).join('');
    const dur = formatDuration(s.duracaoSeg);
    div.innerHTML = `
      <div class="sess-top"><div class="sess-day">${s.dia}</div><div class="sess-date num">${dstr}</div></div>
      <div class="sess-meta">
        <span><b class="num">${sessReps}</b> reps</span>
        <span><b class="num">${Math.round(sessVol).toLocaleString('pt-BR')}</b> kg total</span>
        ${dur ? `<span><b class="num">${dur}</b></span>` : ''}
      </div>
      ${linhas}
    `;
    listEl.appendChild(div);
  });
}

/* ---------- timer ---------- */
const RING_LEN = 666; // 2*pi*106
const ring = document.getElementById('timerRing');
const timerNum = document.getElementById('timerNum');
const presetsWrap = document.getElementById('presets');
const PRESETS = [60,90,120];
let timerTotal = parseInt(localStorage.getItem('timer_preset')||'60');
let timerLeft = timerTotal;
let timerRunning = false;
let timerInterval = null;

function renderPresets(){
  presetsWrap.innerHTML = '';
  PRESETS.forEach(p=>{
    const b = document.createElement('button');
    b.className = 'preset'+(p===timerTotal?' active':'');
    b.textContent = p+'s';
    b.onclick = ()=>{
      timerTotal = p; timerLeft = p;
      localStorage.setItem('timer_preset', p);
      stopTimer();
      renderPresets();
      updateTimerDisplay();
    };
    presetsWrap.appendChild(b);
  });
}
function updateTimerDisplay(){
  timerNum.textContent = timerLeft;
  const frac = timerLeft/timerTotal;
  ring.setAttribute('stroke-dashoffset', RING_LEN*(1-frac));
}
function stopTimer(){
  timerRunning = false;
  clearInterval(timerInterval);
  document.getElementById('timerToggle').textContent = 'Iniciar';
}
function tick(){
  timerLeft--;
  updateTimerDisplay();
  if(timerLeft<=0){
    stopTimer();
    if(navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
    timerLeft = timerTotal;
    updateTimerDisplay();
  }
}
document.getElementById('timerToggle').onclick = ()=>{
  if(timerRunning){ stopTimer(); return; }
  timerRunning = true;
  document.getElementById('timerToggle').textContent = 'Pausar';
  timerInterval = setInterval(tick, 1000);
};

function startAutoRest(){
  const AUTO_REST = 60;
  stopTimer();
  timerTotal = AUTO_REST;
  timerLeft = AUTO_REST;
  renderPresets();
  updateTimerDisplay();
  switchView('timer');
  timerRunning = true;
  document.getElementById('timerToggle').textContent = 'Pausar';
  timerInterval = setInterval(tick, 1000);
}
document.getElementById('timerReset').onclick = ()=>{
  stopTimer();
  timerLeft = timerTotal;
  updateTimerDisplay();
};

/* ---------- init ---------- */
loadSession();
loadWorkoutStart();
renderDayTabs();
renderExList();
renderWorkoutStatus();
renderPresets();
updateTimerDisplay();
tickHeader();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
